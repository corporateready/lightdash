name: Build & push fork image

on:
  push:
    branches:
      - mobile-filters
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/lightdash
    steps:
      - uses: actions/checkout@v4

      # The image bundles DuckDB extensions and nine dbt venvs; the stock
      # runner's free disk is too tight for the build without this.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Only the branch prod pulls (:mobile-filters) redeploys it; a manual
      # run on another branch just publishes that branch's tag to test.
      - name: Trigger Railway redeploy
        if: github.ref_name == 'mobile-filters'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway redeploy --service lightdash --yes
